[project]
name = "ops-copilot"
version = "0.1.0"
description = "Multi-agent IT/HR helpdesk for Microsoft Teams & Outlook built on Microsoft Foundry"
requires-python = ">=3.11"
dependencies = []  # mock mode runs on the standard library only

[project.optional-dependencies]
azure = [
  "agent-framework-core>=1.26",  # Microsoft Agent Framework
  "agent-framework-foundry",      # FoundryChatClient (Foundry project endpoint)
  "msal>=1.30",                   # on-behalf-of token exchange for Graph
  "openai>=1.40",
  "azure-identity>=1.17",
  "azure-search-documents>=11.6",
  "azure-ai-evaluation>=1.0",
  "httpx>=0.27",
]
teams = [
  "microsoft-agents-hosting-aiohttp",
  "microsoft-agents-authentication-msal",
  "aiohttp>=3.9",
]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"evals/*" = ["E402"]
"scripts/*" = ["E402"]
