name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests evals mcp_server scripts
      - name: Unit + security tests
        run: pytest -q
      - name: Offline eval gate (route, grounding, citations, tool calls, red-team)
        run: python evals/run_evals.py --out evals/results/latest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep build + lint
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  # Model-graded evals against real Foundry. Uses GitHub OIDC -> Entra federated credential (no secrets).
  foundry-eval:
    if: github.event_name == 'push' && vars.AZURE_CLIENT_ID != ''
    needs: test-and-eval
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      OPS_COPILOT_MODE: azure
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_AI_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
      AZURE_SEARCH_ENDPOINT: ${{ vars.AZURE_SEARCH_ENDPOINT }}
      AZURE_CONTENT_SAFETY_ENDPOINT: ${{ vars.AZURE_CONTENT_SAFETY_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: pip install -e ".[azure]"
      - run: python evals/azure_evals.py
